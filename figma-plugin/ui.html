<style>
  body { font: 12px Inter, sans-serif; margin: 12px; color: #222; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #0d99ff; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { background: #9ccff7; cursor: default; }
  #status { margin-top: 10px; min-height: 48px; white-space: pre-wrap; }
  .err { color: #d22; }
</style>
<button id="go">Envoyer vers Roblox Studio</button>
<div id="status">Sélectionne un frame puis clique.</div>
<script>
  const BRIDGE = "http://localhost:7777";
  const go = document.getElementById("go");
  const status = document.getElementById("status");
  const show = (text, err) => { status.textContent = text; status.className = err ? "err" : ""; };

  go.onclick = () => {
    go.disabled = true;
    show("Export du design…");
    parent.postMessage({ pluginMessage: { type: "export" } }, "*");
  };

  onmessage = async (e) => {
    const msg = e.data.pluginMessage;
    if (msg.type === "error") { show(msg.text, true); go.disabled = false; return; }
    const count = Object.keys(msg.payload.images).length;
    show(`Envoi au serveur local (${count} image(s) à mettre en ligne)…`);
    try {
      const res = await fetch(BRIDGE + "/push", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-FigmaRoblox": "1" },
        body: JSON.stringify(msg.payload),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || res.statusText);
      show(`Prêt ! (${body.uploaded} nouvelle(s) image(s) envoyée(s))\nDans Studio : bouton « Importer depuis Figma ».`);
    } catch (err) {
      show("Serveur local injoignable ou en erreur :\n" + err.message + "\nLance « node bridge.js ».", true);
    }
    go.disabled = false;
  };
</script>
