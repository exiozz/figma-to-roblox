<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Figma → Roblox</title>
<style>
  :root { --bg:#15171c; --card:#1f2229; --line:#2c3039; --text:#e8eaee; --muted:#8b919d; --accent:#ffc740; --ok:#4ade80; --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width:560px; margin:32px auto; padding:0 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:9px 10px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  .row { display:flex; gap:8px; margin-top:14px; }
  button { padding:9px 14px; border:0; border-radius:7px; font:inherit; font-weight:600; cursor:pointer; background:var(--accent); color:#2b1f04; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:10px; min-height:20px; font-size:13px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .stat { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
  .stat:last-child { border:0; }
  .stat span:first-child { color:var(--muted); }
  #log { margin:0; max-height:180px; overflow:auto; font:12px/1.5 Consolas, monospace; color:var(--muted); white-space:pre-wrap; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--err); }
  .dot.on { background:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Figma → Roblox</h1>
  <p class="sub"><span class="dot" id="dot"></span><span id="state">…</span></p>

  <div class="card">
    <h2>Compte Roblox</h2>
    <label for="key">Clé API Open Cloud <span id="keyHint"></span></label>
    <input id="key" type="password" placeholder="Colle ta clé ici" autocomplete="off">
    <label for="ctype">Les images appartiennent à</label>
    <select id="ctype"><option value="user">Mon compte (User ID)</option><option value="group">Un groupe (Group ID)</option></select>
    <label for="cid">ID</label>
    <input id="cid" inputmode="numeric" placeholder="Laisse vide : rempli automatiquement par « Tester la clé »">
    <div class="row">
      <button id="save">Enregistrer</button>
      <button id="test" class="ghost">Tester la clé</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>Activité</h2>
    <div class="stat"><span>Dernier design reçu</span><span id="last">—</span></div>
    <div class="stat"><span>Images en cache</span><span id="cached">0</span></div>
  </div>

  <div class="card">
    <h2>Journal</h2>
    <pre id="log"></pre>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const say = (text, cls) => { $("msg").textContent = text; $("msg").className = "msg " + (cls || ""); };

  async function api(path, body) {
    const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  async function refresh(first) {
    try {
      const s = await api("/status");
      $("dot").className = "dot" + (s.configured ? " on" : "");
      $("state").textContent = s.configured ? "Prêt — en attente d'un envoi depuis Figma" : "À configurer : ajoute ta clé API";
      $("keyHint").textContent = s.keyMasked ? `(actuelle : ${s.keyMasked})` : "";
      $("last").textContent = s.last ? `${s.last.name} · v${s.last.version} · ${new Date(s.last.at).toLocaleTimeString()}` : "—";
      $("cached").textContent = s.cached;
      $("log").textContent = s.log.join("\n");
      if (first) { $("ctype").value = s.groupId ? "group" : "user"; $("cid").value = s.groupId || s.userId || ""; }
    } catch { $("dot").className = "dot"; $("state").textContent = "Serveur arrêté"; }
  }

  $("save").onclick = async () => {
    const id = $("cid").value.trim();
    if (id && !/^\d+$/.test(id)) return say("L'ID doit être un nombre.", "err");
    const body = !id ? {} : $("ctype").value === "group" ? { groupId: id } : { userId: id };
    if ($("key").value.trim()) body.apiKey = $("key").value.trim();
    try { await api("/config", body); $("key").value = ""; say("Enregistré.", "ok"); refresh(); }
    catch (e) { say(e.message, "err"); }
  };

  $("test").onclick = async () => {
    $("test").disabled = true; say("Vérification…");
    try { const r = await api("/test-key", {}); say(r.message, r.ok ? "ok" : "err"); refresh(true); }
    catch (e) { say(e.message, "err"); }
    $("test").disabled = false;
  };

  refresh(true);
  setInterval(refresh, 2000);
</script>
</body>
</html>
